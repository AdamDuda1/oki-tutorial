<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="30" />
    <title>Aktualizujemy stronę — OKI</title>
    <style>
      :root {
        --brand: oklch(0.679 0.213 36.5);
        --brand-lighter: oklch(0.923 0.045 36.5);
        --text: oklch(0 0 0);
        --text-secondary: oklch(0.457 0 0);
        --background: oklch(1 0 0);
        --border-light: oklch(0.915 0 0);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--text);
        font-family:
          'Quicksand',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
      }

      .karta {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .znak {
        display: inline-block;
        padding: 6px 14px;
        margin-bottom: 22px;
        border-radius: 999px;
        background: var(--brand-lighter);
        color: var(--brand);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
        font-weight: 650;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 15px;
      }

      .pasek {
        position: relative;
        height: 4px;
        margin: 26px 0 14px;
        border-radius: 999px;
        background: var(--border-light);
        overflow: hidden;
      }

      .pasek::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: var(--brand);
        animation: przesuw 1.6s ease-in-out infinite;
      }

      @keyframes przesuw {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      /* Bez animacji dla osob, ktore ich nie chca. */
      @media (prefers-reduced-motion: reduce) {
        .pasek::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }

      .drobne {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="karta">
      <h1>Aktualizujemy stronę</h1>
      <p>Wgrywamy nową wersję. Potrwa to najwyżej dwie minuty.</p>
      <div class="pasek" role="progressbar" aria-label="Trwa aktualizacja"></div>
      <p class="drobne">Ta strona odświeży się sama, gdy skończymy.</p>
    </main>

    <script>
      const cel = location.pathname + location.search
      setInterval(async () => {
        try {
          const odpowiedz = await fetch(cel, { method: 'HEAD', cache: 'no-store' })
          if (odpowiedz.status !== 503) location.reload()
        } catch (_) {

        }
      }, 5000)
    </script>
  </body>
</html>
